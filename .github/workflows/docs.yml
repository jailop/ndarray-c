name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz
        
    - name: Verify installations
      run: |
        doxygen --version
      
    - name: Generate C documentation with Doxygen
      run: |
        doxygen Doxyfile
        echo "C documentation generated successfully"
        ls -la docs/html/
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    # Remove environment protection to allow tag deployments
    # The environment protection rules can be configured in repository settings
    permissions:
      pages: write
      id-token: write
      
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
