name: Generate and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Install Doxygen
      run: |
        sudo apt-get update
        sudo apt-get install -y doxygen graphviz
        
    - name: Setup Zig
      uses: goto-bus-stop/setup-zig@v2
      with:
        version: 0.13.0
        
    - name: Verify installations
      run: |
        doxygen --version
        zig version
      
    - name: Generate C documentation with Doxygen
      run: |
        doxygen Doxyfile
        echo "C documentation generated successfully"
        ls -la docs/c-api/
        
    - name: Generate Zig documentation
      run: |
        mkdir -p docs/zig-api
        zig build-lib -femit-docs=docs/zig-api -fno-emit-bin src/ndarray.zig || true
        echo "Zig documentation generated"
        ls -la docs/zig-api/ || echo "Zig docs directory not created"
        
    - name: Verify index page exists
      run: |
        if [ -f docs/index.html ]; then
          echo "Index page already exists in repository"
          ls -la docs/index.html
        else
          echo "Warning: docs/index.html not found in repository"
          echo "Creating basic index page"
          cat > docs/index.html << 'ENDOFFILE'
        <!DOCTYPE html>
        <html><head><meta charset="UTF-8"><title>ndarray-c Documentation</title></head>
        <body><h1>ndarray-c Documentation</h1>
        <p><a href="c-api/index.html">C API Reference</a> | <a href="zig-api/index.html">Zig API Reference</a></p>
        </body></html>
        ENDOFFILE
        fi
        
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
