# Testament Configuration for ndarray-nim

[backend]
# Use the default Nim backend
backend = "c"

[suites]
# Define test suites
test_suites = [
  "tests/test_basic.nim",
  "tests/test_operations.nim", 
  "tests/test_io.nim",
  "tests/test_missing.nim"
]

[coverage]
# Enable coverage reporting
enabled = true
# Coverage output format (html, json, lcov)
format = "html"
# Output directory for coverage reports
output_dir = "coverage"
# Include source files in coverage analysis
include_sources = [
  "src/*.nim"
]
# Exclude test files from coverage (they shouldn't be counted)
exclude = [
  "tests/*.nim"
]

[reporting]
# Enable detailed test output
verbose = true
# Enable timing information
timing = true
# Enable memory usage reporting
memory = true

[options]
# Test execution options
threads = 4
# Timeout for individual tests (in seconds)
timeout = 300
# Enable parallel test execution
parallel = true